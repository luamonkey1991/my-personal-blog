<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Cá Nhân Tích Hợp Soạn Thảo</title>
  
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    header {
      background-color: #004466;
      color: white;
      text-align: center;
      padding: 20px;
    }
    header h1 { margin: 0; font-size: 28px; }
    
    /* Thanh điều hướng */
    nav {
      background-color: #0b3c5d;
      text-align: center;
      padding: 10px;
    }
    nav button {
      background-color: transparent;
      color: white;
      border: 1px solid white;
      padding: 8px 15px;
      margin: 0 5px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }
    nav button:hover, nav button.active {
      background-color: white;
      color: #0b3c5d;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* KHU VỰC 1: TRANG CHỦ (HIỂN THỊ BÀI VIẾT) */
    .post-card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .post-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .post-card h2 { margin-top: 0; color: #0b3c5d; }
    .date { font-size: 13px; color: #888; margin-bottom: 10px; }

    #post-detail {
      display: none;
      background: white;
      padding: 30px;
      border-radius: 8px;
    }
    .back-btn {
      background-color: #e0e0e0; border: none; padding: 8px 15px;
      border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 20px;
    }
    /* Đảm bảo ảnh trong bài viết không bị tràn */
    .post-content img { max-width: 100%; height: auto; margin: 10px 0; }

    /* KHU VỰC 2: TRANG QUẢN TRỊ (VIẾT BÀI MỚI) */
    #admin-panel {
      display: none; /* Mặc định ẩn */
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input.title-input {
      width: 100%; padding: 12px; font-size: 18px; margin-bottom: 15px;
      border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
    }
    /* Chỉnh chiều cao cho khung soạn thảo */
    #editor-container { height: 350px; margin-bottom: 20px; }
    
    .publish-btn {
      background-color: #28a745; color: white; border: none;
      padding: 12px 25px; font-size: 16px; font-weight: bold;
      border-radius: 4px; cursor: pointer; width: 100%;
    }
    .publish-btn:hover { background-color: #218838; }
  </style>
</head>
<body>

  <header>
    <h1>Blog Của Tôi</h1>
  </header>

  <nav>
    <button id="btn-home" class="active" onclick="switchTab('home')">🏠 Xem Blog</button>
    <button id="btn-admin" onclick="switchTab('admin')">✍️ Viết Bài Mới</button>
  </nav>

  <div class="container">
    
    <div id="home-view">
      <div id="post-list"></div>
      
      <div id="post-detail">
        <button class="back-btn" onclick="showList()">← Quay lại danh sách</button>
        <h2 id="detail-title" style="color: #004466; font-size: 26px; margin-top: 0;"></h2>
        <div id="detail-date" class="date"></div>
        <div id="detail-content" class="post-content"></div>
      </div>
    </div>

    <div id="admin-panel">
      <h2 style="margin-top:0; color:#0b3c5d;">Soạn Thảo Bài Viết Mới</h2>
      
      <input type="text" id="post-title" class="title-input" placeholder="Nhập tiêu đề bài viết...">
      
      <div id="editor-container"></div>
      
      <button class="publish-btn" onclick="publishPost()">Đăng Bài</button>
    </div>

  </div>

  <script>
    /* --- KHỞI TẠO DỮ LIỆU BAN ĐẦU --- */
    // Kiểm tra xem có bài viết nào lưu trong trình duyệt chưa, nếu chưa thì tạo 1 bài mẫu
    let posts = JSON.parse(localStorage.getItem('myBlogPosts')) || [
      {
        id: Date.now(),
        title: "Bài viết mẫu đầu tiên",
        date: new Date().toLocaleDateString('vi-VN'),
        content: "<p>Chào mừng bạn đến với blog. Hãy chuyển sang tab <b>Viết Bài Mới</b> để thử công cụ soạn thảo nhé!</p>"
      }
    ];

    /* --- KHỞI TẠO CÔNG CỤ SOẠN THẢO QUILL --- */
    var quill = new Quill('#editor-container', {
      theme: 'snow', // Giao diện giống Word
      placeholder: 'Viết nội dung bài viết của bạn vào đây...',
      modules: {
        toolbar: [
          [{ 'header': [1, 2, 3, false] }], // Tiêu đề
          ['bold', 'italic', 'underline', 'strike'], // In đậm, nghiêng, gạch dưới
          [{ 'color': [] }, { 'background': [] }], // Màu chữ, màu nền
          [{ 'list': 'ordered'}, { 'list': 'bullet' }], // Danh sách
          ['link', 'image', 'video'], // Chèn link, ảnh, video
          ['clean'] // Xóa định dạng
        ]
      }
    });

    /* --- HÀM CHUYỂN ĐỔI TAB (XEM BLOG / VIẾT BÀI) --- */
    function switchTab(tab) {
      const homeView = document.getElementById('home-view');
      const adminPanel = document.getElementById('admin-panel');
      const btnHome = document.getElementById('btn-home');
      const btnAdmin = document.getElementById('btn-admin');

      if (tab === 'home') {
        homeView.style.display = 'block';
        adminPanel.style.display = 'none';
        btnHome.classList.add('active');
        btnAdmin.classList.remove('active');
        renderList(); // Cập nhật lại danh sách bài viết
      } else {
        homeView.style.display = 'none';
        adminPanel.style.display = 'block';
