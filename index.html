<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Blog Cá Nhân Firebase</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    /* (Giữ nguyên các style cũ của bạn ở đây) */
    body { font-family: sans-serif; padding: 20px; }
    #admin-panel, #post-detail { display: none; }
    .post-card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; cursor: pointer; }
  </style>
</head>
<body>

  <nav>
    <button id="btn-home">🏠 Xem Blog</button>
    <button id="btn-admin" style="display:none;">✍️ Viết Bài Mới</button>
    <button id="btn-login">🔑 Đăng nhập Admin</button>
    <button id="btn-logout" style="display:none;">🚪 Đăng xuất</button>
  </nav>

  <div id="home-view">
    <div id="post-list"></div>
    <div id="post-detail">
      <button onclick="switchTab('home')">← Quay lại</button>
      <h2 id="detail-title"></h2>
      <div id="detail-content"></div>
    </div>
  </div>

  <div id="admin-panel">
    <input type="text" id="post-title" placeholder="Tiêu đề...">
    <div id="editor-container" style="height:200px"></div>
    <button id="btn-publish">Đăng Bài</button>
  </div>

  <script>
    // 1. Cấu hình Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAq5o5ub-RvJdgKQqUph7VcawHFry4sF9o",
      authDomain: "bloglua-9898e.firebaseapp.com",
      projectId: "bloglua-9898e",
      storageBucket: "bloglua-9898e.firebasestorage.app",
      messagingSenderId: "173694829368",
      appId: "1:173694829368:web:a684f15bd97217b39d77cd"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    var quill = new Quill('#editor-container', { theme: 'snow' });

    // 2. Lấy dữ liệu từ Cloud Firestore
    db.collection("posts").onSnapshot(snapshot => {
      const list = document.getElementById('post-list');
      list.innerHTML = "";
      snapshot.forEach(doc => {
        const post = doc.data();
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `<h2>${post.title}</h2>`;
        card.onclick = () => showPost(doc.id);
        list.appendChild(card);
      });
    });

    // 3. Đăng nhập Admin (Email/Pass cố định)
    document.getElementById('btn-login').onclick = () => {
      const email = prompt("Email admin:");
      const pass = prompt("Mật khẩu:");
      auth.signInWithEmailAndPassword(email, pass)
        .then(() => alert("Đăng nhập thành công!"))
        .catch(err => alert(err.message));
    };

    auth.onAuthStateChanged(user => {
      document.getElementById('btn-admin').style.display = user ? 'inline-block' : 'none';
      document.getElementById('btn-login').style.display = user ? 'none' : 'inline-block';
      document.getElementById('btn-logout').style.display = user ? 'inline-block' : 'none';
    });

    // 4. Đăng bài
    document.getElementById('btn-publish').onclick = () => {
      db.collection("posts").add({
        title: document.getElementById('post-title').value,
        content: quill.root.innerHTML,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("Đăng thành công!");
        switchTab('home');
      });
    };

    function showPost(id) {
      db.collection("posts").doc(id).get().then(doc => {
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('post-detail').style.display = 'block';
        document.getElementById('detail-title').innerText = doc.data().title;
        document.getElementById('detail-content').innerHTML = doc.data().content;
      });
    }

    function switchTab(tab) {
      document.getElementById('home-view').style.display = (tab === 'home') ? 'block' : 'none';
      document.getElementById('admin-panel').style.display = (tab === 'admin') ? 'block' : 'none';
      document.getElementById('post-detail').style.display = 'none';
    }
    
    document.getElementById('btn-home').onclick = () => switchTab('home');
    document.getElementById('btn-admin').onclick = () => switchTab('admin');
    document.getElementById('btn-logout').onclick = () => auth.signOut();
  </script>
</body>
</html>
