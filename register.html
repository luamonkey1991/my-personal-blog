<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-card">
    <h2>Đăng ký</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="pass" placeholder="Mật khẩu">
    <button id="btn-register">Đăng ký</button>
    <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAq5o5ub-RvJdgKQqUph7VcawHFry4sF9o",
      authDomain: "bloglua-9898e.firebaseapp.com",
      projectId: "bloglua-9898e",
      storageBucket: "bloglua-9898e.firebasestorage.app",
      messagingSenderId: "173694829368",
      appId: "1:173694829368:web:a684f15bd97217b39d77cd"
    };
    firebase.initializeApp(firebaseConfig);

    document.getElementById('btn-register').onclick = () => {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;

  firebase.auth().createUserWithEmailAndPassword(email, pass)
    .then(() => {
      alert("Đăng ký thành công!");
      window.location.href = "index.html";
    })
    .catch(e => {
      // VIỆT HÓA THÔNG BÁO LỖI Ở ĐÂY
      if (e.code === 'auth/email-already-in-use') {
        alert("Email này đã được sử dụng, vui lòng chọn email khác hoặc đăng nhập!");
      } else if (e.code === 'auth/weak-password') {
        alert("Mật khẩu quá yếu, vui lòng nhập ít nhất 6 ký tự.");
      } else if (e.code === 'auth/invalid-email') {
        alert("Email không hợp lệ.");
      } else {
        alert("Lỗi: " + e.message); // Các lỗi khác nếu có
      }
    });
};
  </script>
</body>
</html>
