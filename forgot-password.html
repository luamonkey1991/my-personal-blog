<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quên mật khẩu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-card">
    <h2>Khôi phục mật khẩu</h2>
    <p style="font-size: 0.9em; color: #666;">Nhập email của bạn, chúng tôi sẽ gửi link đặt lại mật khẩu.</p>
    <input type="email" id="email" placeholder="Email của bạn">
    <button id="btn-reset">Gửi link xác nhận</button>
    <p style="margin-top:20px;"><a href="login.html">Quay lại đăng nhập</a></p>
  </div>
  <script>
  const firebaseConfig = {
    apiKey: "AIzaSyAq5o5ub-RvJdgKQqUph7VcawHFry4sF9o",
    authDomain: "bloglua-9898e.firebaseapp.com",
    projectId: "bloglua-9898e",
    storageBucket: "bloglua-9898e.firebasestorage.app",
    messagingSenderId: "173694829368",
    appId: "1:173694829368:web:a684f15bd97217b39d77cd"
  };
  
  // DÒNG NÀY RẤT QUAN TRỌNG - PHẢI CÓ DÒNG NÀY ĐỂ KÍCH HOẠT
  firebase.initializeApp(firebaseConfig);
</script>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = { 
      /* DÁN CẤU HÌNH CỦA BẠN VÀO ĐÂY */ 
    };
    firebase.initializeApp(firebaseConfig);

    document.getElementById('btn-reset').onclick = () => {
      const email = document.getElementById('email').value;
      if (!email) return alert("Vui lòng nhập email!");

      firebase.auth().sendPasswordResetEmail(email)
        .then(() => {
          alert("Kiểm tra email của bạn! Link đổi mật khẩu đã được gửi đi.");
          window.location.href = "login.html";
        })
        .catch(e => alert("Lỗi: " + e.message));
    };
  </script>
</body>
</html>
