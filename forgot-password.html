<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Khôi phục mật khẩu</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="auth-card">
    <h2>Khôi phục mật khẩu</h2>
    <input type="email" id="email" placeholder="Email của bạn">
    <button id="btn-reset">Gửi link xác nhận</button>
    <p><a href="login.html">Quay lại đăng nhập</a></p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAq5o5ub-RvJdgKQqUph7VcawHFry4sF9o",
      authDomain: "bloglua-9898e.firebaseapp.com",
      projectId: "bloglua-9898e",
      storageBucket: "bloglua-9898e.firebasestorage.app",
      messagingSenderId: "173694829368",
      appId: "1:173694829368:web:a684f15bd97217b39d77cd"
    };
    
    // Kiểm tra xem đã khởi tạo chưa để tránh lỗi
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    document.getElementById('btn-reset').onclick = () => {
      const email = document.getElementById('email').value;
      if (!email) return alert("Vui lòng nhập email!");

      firebase.auth().sendPasswordResetEmail(email)
        .then(() => {
          alert("Link khôi phục đã được gửi về email của bạn!");
          window.location.href = "login.html";
        })
        .catch(e => alert("Lỗi: " + e.message));
    };
  </script>
</body>
</html>
